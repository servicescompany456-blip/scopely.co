<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCOPELY Coin Flip</title>

<link rel="stylesheet" href="css/coinflip.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- TOPBAR -->

    <div class="topbar">

        <a href="games.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Games
        </a>

        <h1>
            <i class="fas fa-coins"></i>
            SCOPELY COIN FLIP
        </h1>

    </div>

    <!-- PLAYER STATS -->

    <div class="stats-grid">

        <div class="stat-card">

            <h3>Balance</h3>

            <h2>
                $
                <span id="balance">
                    0.00
                </span>
            </h2>

        </div>

        <div class="stat-card">

            <h3>XP</h3>

            <h2 id="xp">
                0
            </h2>

        </div>

        <div class="stat-card">

            <h3>Win Streak</h3>

            <h2 id="streak">
                0
            </h2>

        </div>

    </div>

    <!-- GAME CARD -->

    <div class="game-card">

        <h2>
            Coin Flip Arena
        </h2>

        <p>
            Bet $3 and win $9
        </p>

        <!-- COIN -->

        <div class="coin-area">

            <div id="coin" class="coin">

                <div class="front">
                    H
                </div>

                <div class="back">
                    T
                </div>

            </div>

        </div>

        <h3 id="resultText">
            Choose Heads or Tails
        </h3>

        <!-- CHOICE -->

        <div class="choice-buttons">

            <button
            class="heads-btn"
            onclick="playCoinFlip('heads')">

                HEADS

            </button>

            <button
            class="tails-btn"
            onclick="playCoinFlip('tails')">

                TAILS

            </button>

        </div>

        <!-- BET INFO -->

        <div class="bet-info">

            <div>

                <span>Entry Fee</span>

                <strong>$3</strong>

            </div>

            <div>

                <span>Potential Win</span>

                <strong>$9</strong>

            </div>

        </div>

    </div>

    <!-- HISTORY -->

    <div class="history-card">

        <h2>

            <i class="fas fa-history"></i>

            Recent Results

        </h2>

        <div id="historyList">

            No results yet.

        </div>

    </div>

</div>

<script type="module" src="js/coinflip.js"></script>

</body>
</html>
