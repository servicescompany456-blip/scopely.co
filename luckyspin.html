<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCOPELY Lucky Spin</title>

<link rel="stylesheet" href="css/luckyspin.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo">

SCOPELY

</div>

<div class="player">

Balance:
$<span id="balance">0.00</span>

</div>

</header>

<div class="container">

<div class="left-panel">

<h2>PLAYER STATS</h2>

<div class="stat">

Balance

<h3>
$<span id="statBalance">0.00</span>
</h3>

</div>

<div class="stat">

XP

<h3>
<span id="xp">0</span>
</h3>

</div>

<div class="stat">

Level

<h3>
<span id="level">1</span>
</h3>

</div>

</div>

<div class="game-panel">

<h1>LUCKY SPIN</h1>

<div class="wheel-container">

<div id="wheel">

<div>$0</div>
<div>$2</div>
<div>$5</div>
<div>$10</div>
<div>$20</div>
<div>$50</div>
<div>$100</div>
<div>LOSE</div>

</div>

</div>

<button id="spinBtn">

SPIN ($1)

</button>

<div id="result">

Good Luck!

</div>

</div>

<div class="right-panel">

<h2>SYSTEM LOG</h2>

<div id="logs">

Waiting...

</div>

</div>

</div>

<script type="module" src="js/luckyspin.js"></script>

</body>

</html>
