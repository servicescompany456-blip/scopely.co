<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Message Sent | SCOPELY</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
background:#0d1117;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
font-family:Arial,sans-serif;
padding:20px;
}

.success-container{
max-width:600px;
width:100%;
background:#161b22;
padding:50px;
border-radius:20px;
text-align:center;
box-shadow:0 0 30px rgba(0,208,132,0.2);
}

.success-icon{
font-size:90px;
color:#00d084;
margin-bottom:20px;
}

.success-container h1{
color:white;
margin-bottom:15px;
}

.success-container p{
color:#cbd5e1;
line-height:1.8;
margin-bottom:30px;
}

.success-buttons{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.success-buttons a{
text-decoration:none;
padding:14px 30px;
border-radius:10px;
font-weight:bold;
transition:.3s;
}

.home-btn{
background:#00d084;
color:black;
}

.home-btn:hover{
transform:translateY(-3px);
}

.dashboard-btn{
background:#1f2937;
color:white;
border:1px solid #00d084;
}

.dashboard-btn:hover{
background:#00d084;
color:black;
}

@media(max-width:768px){

.success-container{
padding:30px;
}

.success-icon{
font-size:70px;
}

.success-container h1{
font-size:28px;
}

}
</style>

</head>

<body>

<div class="success-container">

<div class="success-icon">
<i class="fas fa-check-circle"></i>
</div>

<h1>Message Sent Successfully</h1>

<p>
Thank you for contacting SCOPELY Support.
Our team has received your message and will respond as soon as possible.
Please check your email regularly for updates.
</p>

<div class="success-buttons">

<a href="index.html" class="home-btn">
Return Home
</a>

<a href="dashboard.html" class="dashboard-btn">
Dashboard
</a>

</div>

</div>

</body>
</html>
